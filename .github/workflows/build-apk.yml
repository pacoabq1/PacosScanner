name: Build test APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Name the APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PacosScanner-test.apk

      - name: Keep the APK with this run
        uses: actions/upload-artifact@v4
        with:
          name: PacosScanner-test-apk
          path: PacosScanner-test.apk

      # A commit message containing [hold-release] still builds (to check it compiles) but
      # leaves the current "Test build" release alone.
      - name: Publish to the "Test build" release (easy to download on a phone)
        if: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') && !contains(github.event.head_commit.message, '[hold-release]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build PacosScanner-test.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Paco's Scanner test build #${GITHUB_RUN_NUMBER}" \
            --notes "Built from branch ${GITHUB_REF_NAME}, commit ${GITHUB_SHA::7}. Tap PacosScanner-test.apk below on your phone to download and install."

      - name: Publish an official release when main gets a new version
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; bump versionName in app/build.gradle.kts for a new one."
            exit 0
          fi
          cp PacosScanner-test.apk "PacosScanner-${TAG}.apk"
          gh release create "$TAG" "PacosScanner-${TAG}.apk" \
            --target "$GITHUB_SHA" \
            --latest \
            --title "Paco's Scanner ${TAG}" \
            --notes "Official release ${TAG}. Tap PacosScanner-${TAG}.apk below on your phone to download and install. It installs over the test builds and keeps your saved documents."
